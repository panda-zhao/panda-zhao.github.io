<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宇明电子电瓶检测仪 v1.0.0</title>
  <script src="./util.js"></script>
  <script src="../../js/vue.js"></script>
  <style>
    #app {
      /* text-align: center; */
      padding: 48px 16px 0;
    }

    .header {
      display: flex;
      align-items: center;
      align-items: center;
    }

    .loading {
      position: fixed;
      top: 40%;
      left: 40%;
      right: 40%;
      bottom: 40%;
      background: rgba(0, 0, 0, .8);
      color: #f00;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .floatingView {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(0, 0, 0, .15);
      color: #f00;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 0;
      /* font-weight: bold; */
    }

    .container {
      display: flex;
      flex-direction: column;
    }

    h2 {
      border-left: 3px solid blue;
      /* border-bottom: 1px solid #ccc; */
      font-size: 24px;
      padding: 0 8px;
      margin: 16px 0;
      color: #333;
    }

    button {
      display: inline-block;
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      text-transform: uppercase;
      color: #fff;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
      transition: all 0.3s ease;
    }

    button:hover {
      cursor: pointer;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
    }

    button:active {
      transform: translateY(0);
      box-shadow: none;
    }


    input[type="text"],
    input[type="password"],
    input[type="email"] {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: none;
      transition: border-color 0.3s ease;
      margin-bottom: 16px;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    input[type="email"]:focus {
      outline: none;
      border-color: #007bff;
    }

    input[type="text"]::placeholder,
    input[type="password"]::placeholder,
    input[type="email"]::placeholder {
      color: #999;
    }

    input[type="text"]:hover,
    input[type="password"]:hover,
    input[type="email"]:hover {
      border-color: #ccc;
    }

    textarea {
      box-sizing: border-box;
      width: 100%;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: none;
      transition: border-color 0.3s ease;
    }

    textarea:focus {
      outline: none;
      border-color: #007bff;
    }

    textarea::placeholder {
      color: #999;
    }

    textarea:hover {
      border-color: #ccc;
    }

    .info {
      color: blue;
      font-weight: bold;
      padding: 0 15px;
    }

    .footer {
      margin-top: 15px;
      color: blue;
      text-align: center;
    }

    li {
      font-size: 16px;
      color: #333;
      margin-bottom: 8px;
    }

    .switch {
      width: 50px;
      height: 25px;
      background-color: #ccc;
      border-radius: 25px;
      position: relative;
      transition: background-color 0.3s;
      cursor: pointer;
      margin: 0 20px 0 10px;
    }

    .switch.is-on {
      background-color: #4cd964;
    }

    .switch-handle {
      width: 23px;
      height: 23px;
      background-color: #fff;
      border-radius: 50%;
      position: absolute;
      top: 1px;
      left: 1px;
      transition: left 0.3s;
    }

    .switch.is-on .switch-handle {
      left: 24px;
    }

    .box {
      width: 100%;
      height: calc(100vh - 330px);
    }

    .z-button2 {
      color: #fff;
      background-color: #f00;
    }
  </style>
</head>

<body>
  <div id="app">
    <div v-if="loading" class="loading">
      <div></div>
      {{errMsg}}
    </div>
    <div class="floatingView">{{errMsg}}</div>
    <div class="header" v-if="!isConnected">
      <!-- 是否加密
      <div class="switch" :class="{ 'is-on': isEncrypted }" @click="isEncrypted = !isEncrypted">
        <div class="switch-handle"></div>
      </div> -->
      <button id="z-button" class="z-button" @click="connectOBD">连接蓝牙</button>
    </div>

    <div class="header" v-if="isConnected">
      <div class="info">当前协议：{{ATDP}}[{{isEncrypted ? '加密模式': '未加密'}}]</div>
      <button id="z-button" class="z-button2" v-if="isConnected" @click="closeBLEConnection">断开连接</button>
    </div>

    <div class="container">
      <div>
        <h2>请输入要发送的指令</h2>
        <input type="text" v-model="inputValue" placeholder="请输入指令">
        <button @click="startJob">发送单个指令</button>
        <button @click="startAll">测试所有指令</button>
        <button @click="startLoop">老化测试</button>
      </div>

      <div>
        <h2>数据发送和回复记录 <button @click="dataHTML=''">重置</button></h2>
        <div>
          <textarea name="" id="" cols="30" rows="20" v-model="dataHTML" readonly class="box"></textarea>
        </div>
        <!-- <div v-html="dataHTML" class="container"></div> -->

      </div>
    </div>


    <footer>
      <div>参考文档</div>
      <ul>
        <li>
          <a href="https://webbluetoothcg.github.io/web-bluetooth/#bluetooth" target="_blank">Web Bluetooth提案</a>
        </li>
        <li>
          <a href="https://developer.mozilla.org/zh-CN/docs/Web/API/Bluetooth" target="_blank">MDN社区 Bluetooth</a>
        </li>
      </ul>
    </footer>

  </div>


  <script>
    const eventTarget = new EventTarget(); // 创建 EventTarget 实例
    const app = new Vue({
      el: '#app',
      data: {
        ATDP: '暂无', // ISO14230-4(KWP FAST) AUTO, ISO 15765-4 (CAN 29/500)
        loading: false,
        gatt_service: null,
        isEncrypted: false,
        isConnected: false,
        isLoop: false,
        queue: [], // 当前任务队列
        currentCMD: null, // 当前正在执行的指令
        errMsg: '请先点击连接蓝牙', // 异常信息
        dataHTML: '',
        characteristic_write: null, // 写入的特征值
        characteristic_notify: null, // 订阅的特征值
        tem: '',// 数据存储
        inputValue: "", // 手动输入的值
      },
      created() {
        console.log('Web Bluetooth API 支持情况：', navigator.bluetooth ? '支持' : '不支持', "版本v1.0.0");
      },
      computed: {
        // ATDP() {
        //   return localStorage.getItem('____ATDP')
        // }
      },
      methods: {
        connectOBD() {
          try {
            let UUID = "0000fff0-0000-1000-8000-00805f9b34fb" // 不加密
            if (this.isEncrypted) {
              UUID = "0000ffe0-0000-1000-8000-00805f9b34fb"
            }
            let option = {
              filters: [
                {services: [UUID]}, // 一个数组，包含要查找的蓝牙设备提供的服务 UUID，必须小写
                // { name: 'BT15' }, // 字符串，精确指定设备名称 OBDII
                // {namePrefix: '前缀'} // 字符串，设备名称的前缀
              ],
              acceptAllDevices: false, // 默认false, 是否可以接受所有蓝牙设备, 为false时必须设置filters 
              optionalServices: [UUID], // 一个数组，包含要在连接设备后可能需要使用的服务的 UUID，但这些服务不在 filters 中的 services 数组里。, 必须小写
            }
            console.log('是否加密🔐', this.isEncrypted, UUID)


            navigator.bluetooth.requestDevice(option).then(async (device) => {
              console.log('1-找到设备', device)

              let deviceName = device.gatt.device.name;
              this.errMsg = `${device.name} 已连接`

              const server = await device.gatt.connect(); // 连接到 GATT 服务器
              this.gatt_service = server
              const OBDII_services = await server.getPrimaryServices(); // 获取所有服务
              console.log('所有服务', OBDII_services)

              const OBDII_service = await server.getPrimaryService(UUID); // 获取指定服务
              console.log('2-服务信息', OBDII_service)
              // 获取服务的特征值缓冲区
              const characteristics = await OBDII_service.getCharacteristics() // 获取所有特征值
              console.log('3-所有特征值', characteristics)

              let notifyUUID = null
              let writeUUID = null
              for (let i = 0; i < characteristics.length; i++) {
                const item = characteristics[i];
                // 可通知属性
                if (item.properties.notify || item.properties.indicate) {
                  notifyUUID = item.uuid
                }
                // 可写,只有一个特征值
                if (item.properties.write) {
                  writeUUID = item.uuid
                }
              }
              // 获取服务的特征值缓冲区
              this.characteristic_notify = await OBDII_service.getCharacteristic(notifyUUID)// 获取指定特征值
              console.log('4-通知特征值', this.characteristic_notify)
              this.characteristic_write = await OBDII_service.getCharacteristic(writeUUID)// 获取指定特征值
              console.log('5-写入特征值', this.characteristic_write)

              console.log('6-启动订阅，开始监听特征值变化',)
              this.characteristic_notify.startNotifications(); // 启用监听特征值改变
              this.onBLECharacteristicValueChange() // 监听低功耗蓝牙设备特征值变化 ？重复启用是否会有问题
              this.isConnected = true
              // 执行默认队列
              // this.queue = ['ATZ', 'ATE0', 'ATL0', 'ATH1', 'ATSP0', 'AT+VERSION', 'ATI', '0100', 'ATDP', "ATRV"]
              this.queue = ["0F", "04", '10']
              this.write_multiple_cmd(this.queue)
            })
              .catch(function (error) {
                console.log("出现错误： ", error);
                alert(error.message)
              });
          } catch (exception) {
            console.error(exception);
            this.errMsg = exception
            alert("获取设备详细信息时发生错误");
          }
        },
        closeBLEConnection() {
          this.gatt_service.device.gatt.disconnect()
          console.log('已成功断开连接');
          this.isConnected = false
        },
        async write_multiple_cmd(arr) {
          for (let index = 0; index < arr.length; index++) {
            const element = arr[index];
            let chunk = await this.writeCmd(element)
            console.log('响应完毕', element, chunk)
            if (index === arr.length - 1 && this.isLoop) {
              console.log('一轮结束')
              this.startLoop()
            }
          }
        },
        // 写数据
        writeCmd(cmd) {
          return new Promise(async (resolve, reject) => {
            if (this.loading) {
              console.log('当前有未完成的指令', cmd)
              reject(new Error('当前有未完成的指令'));
              return
            }
            console.log('1、开始发送指令', cmd, this.formatTime())
            if(cmd === '10'){
              // let encryStr = getRndHexStr()
              let encryStr = '40C6B952'
              console.log('待加密字符串', encryStr)
              // 把字符串转换成asc十六进制
              let hex = encryStr.split('').map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join('')
              // 加密
              // const cal_result = int2hexStr(EDesEn_Crypt(parseInt(encryStr, 16), 0xBAC9AA76))
              // console.log('加密结果', cal_result)
              cmd = '10' + hex
            }
            this.errMsg = `正在发送指令 ${cmd}`
            // this.onValueChangeCallback = (data)=>{
            //   return data
            // }
            this.loading = true
            const arrayBuffer = this.buildProtocolFrame(cmd)
            this.currentCMD = cmd
            this.sendTimestamp = this.formatTime()
              // this.dataHTML = `发送: ${cmd}\r\n` + this.dataHTML // 发送记录
            console.log('2、实际写入', arrayBuffer)
             
            /// 监听 data 事件，等待 receive 函数的结果
            const handleData = (event) => {
              let result = event.detail
              console.log("接收eventTarget响应消息:", result);
              resolve(result);
              // 移除监听器，避免重复监听
              eventTarget.removeEventListener('data', handleData);
            };
            eventTarget.addEventListener('data', handleData);
            this.characteristic_write.writeValue(arrayBuffer).then(async (res) => {
             console.log('3、发送指令成功', cmd, this.formatTime())
            }).catch((error) => {
              alert("获取设备详细信息时发生错误");
              this.errMsg = error
              console.log('发送失败', error)
              reject(err)
            })
          });
        },
        // 接收回复消息
        onBLECharacteristicValueChange() {
          return new Promise((resolve, reject) => {
            this.characteristic_notify.addEventListener('characteristicvaluechanged', e => {
              let value = e.target.value // 当前帧返回的数据
              this.endTimestamp = this.formatTime()
              console.log('5、收到回复特征值变化', value, this.endTimestamp)
              this.errMsg = `发送指令 ${this.currentCMD} 成功`
              // console.log('5、收到回复特征值变化',  JSON.stringify(value), this.endTimestamp)
              // let chunk = this.textDecoder(value)
              // let result = this.bytesToHex(new Uint8Array(value.buffer)) // 把ArrayBuffer转HEX字符串
              let result = this.bytesToHex(value.buffer) // 把ArrayBuffer转HEX字符串
              // 发送事件，携带结果数据
              const event = new CustomEvent('data', { detail: result });
              eventTarget.dispatchEvent(event);
              this.dataHTML = `\r\n${this.sendTimestamp} 发送：${this.currentCMD}(${this.arrayBuffer})\r\n${this.endTimestamp} 回复：${result}\r\n` + this.dataHTML
              this.loading = false
              console.log('===== 已执行完成 =====')
              resolve(result); // 解析特征值变化
            });
          })
          // 监听低功耗蓝牙设备特征值变化,必须先启用startNotifications，才能监听到

        },
   
        async startJob() {
          if (!this.isConnected) {
            alert('错误！请先连接蓝牙再测试！')
            return
          }
          let cmd = this.inputValue
          if (!cmd) {
            alert('错误！请先输入指令！')
            return
          }
          this.isLoop = false
          this.queue.push(cmd)
          this.writeCmd(cmd)
        },
        
        startAll() {
          if (!this.isConnected) {
            alert('错误！请先连接蓝牙再测试！')
            return
          }
          this.isLoop = false
          // 执行默认队列
          let queue = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '0A', '0B', '0C', '0D', '0E', '0F']
          this.queue = queue
          // this.writeCmd()
          this.write_multiple_cmd(this.queue)
        },
        startLoop() {
          if (!this.isConnected) {
            alert('错误！请先连接蓝牙再测试！')
            return
          }
          this.isLoop = true
          let queue = ['01', '02', '03', '04', '05', '06', '07', '08', '09', '0A', '0B', '0C', '0D', '0E', '0F']
          this.queue = queue
          this.write_multiple_cmd(this.queue, true)
        },
        formatTime() {
          let date = new Date()
          const year = date.getFullYear()
          const month = date.getMonth() + 1
          const day = date.getDate()
          const hour = date.getHours()
          const minute = date.getMinutes()
          const second = date.getSeconds()
          const milliseconds = date.getMilliseconds()
          const formatNumber = n => {
            n = n.toString()
            return n[1] ? n : '0' + n
          }
          return [year, month, day].map(formatNumber).join('-') + ' ' + [hour, minute, second].map(formatNumber).join(':') + ':' + milliseconds
        },

        bytesToHex(bytes) {
          return Array.from(new Uint8Array(bytes), byte => {
            return ('0' + (byte & 0xFF).toString(16)).slice(-2);
          }).join(' ').toUpperCase();
        },
        // 字符串转ArrayBuffer
        textEncoder: function (cmd) {
          let str = cmd + '\r'
          // // 下边这个方法也可以
          if (this.isEncrypted) {
            str = encrypt(str)
          }
          let result = new TextEncoder().encode(str).buffer
          // 下边这个方法兼容性更好
          // var bufView = new Uint8Array(str.length);
          // for (var i = 0; i < str.length; i++) {
          //   bufView[i] = str.charCodeAt(i);
          // }
          // let result = bufView.buffer;
          return result
        },
        // ArrayBuffer转字符串
        textDecoder: function (value) {
          console.log('解密前', value)
          let result = new TextDecoder().decode(value)
          // 下边这个方法兼容性更好
          // let uint8Array = new Uint8Array(value)
          // let result = ''
          // for (let i = 0; i < uint8Array.length; i++) {
          //   result += String.fromCharCode(uint8Array[i]);
          // }

          if (this.isEncrypted) {
            result = decrypt(result)
          }
          return result
        },
        buildProtocolFrame(info) {
          // 取前两位为cmd
          const cmd = parseInt(info.substring(0, 2), 16);
          console.log('cmd', cmd)
          let data = []
          const dataHex = info.substring(2).trim();
          if(dataHex){
            for (let i = 0; i < dataHex.length; i += 2) {
              const byteStr = dataHex.substr(i, 2);
              const byte = parseInt(byteStr, 16);
              if (isNaN(byte)) {
                throw new Error(`无效的数据字节: ${byteStr}`);
              }
              data.push(byte);
            }
          }
          console.log('data', data)
          // 计算帧长度：帧长度(4) + 命令(1) + 数据(N) + 校验(1) = 6 + N
          const frameLength = 4 + 1 + data.length + 1;
          console.log('frameLength', frameLength)
          // 计算长度字节（LH, LL）
          const LH = (frameLength >> 8) & 0xFF; // 长度高字节
          const LL = frameLength & 0xFF;        // 长度低字节
          const notLH = (~LH) & 0xFF;           // LH取反
          const notLL = (~LL) & 0xFF;           // LL取反
          
          // 构建帧数据（不包括校验位）
          const frameData = [
            0x55, 0xAA,           // 帧头
            LH, LL, notLH, notLL, // 帧长度字段
            cmd,                  // 命令字
            ...data          // 数据字段
          ];
          
          // 计算校验位：从帧长度开始到数据结束的异或校验
          let checksum = 0;
          for (let i = 2; i < frameData.length; i++) {
            checksum ^= frameData[i];
          }
          
          // 添加校验位
          frameData.push(checksum);
          const result = Array.from(frameData).map(b => b.toString(16).padStart(2, '0').toUpperCase())
          console.log('最终数据', result)
          this.arrayBuffer = result.join(' ') 
          const buffer = new Uint8Array(frameData).buffer;
          return buffer
        }
        
      }
    })

  </script>
</body>

</html>
