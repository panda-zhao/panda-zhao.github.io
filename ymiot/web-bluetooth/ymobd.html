<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YM OBD · Web Bluetooth</title>
  <script src="../../js/vue.js"></script>
  <style>
    :root {
      --bg: #f0f4f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --border: #e2e8f0;
      --text: #1e293b;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --terminal-bg: #f8fafc;
      --terminal-text: #0f766e;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: light;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(37, 99, 235, 0.08), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(22, 163, 74, 0.06), transparent);
      pointer-events: none;
      z-index: 0;
    }

    #app {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 40px;
    }

    /* ── Top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand p {
      margin: 2px 0 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      background: var(--surface);
      border: 1px solid var(--border);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .status-pill.connected .status-dot {
      background: var(--success);
      box-shadow: 0 0 6px rgba(22, 163, 74, 0.5);
      animation: pulse 2s ease-in-out infinite;
    }

    .status-pill.busy .status-dot {
      background: var(--warning);
      animation: pulse 1s ease-in-out infinite;
    }

    .status-pill.disconnected .status-dot {
      background: var(--text-muted);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* ── Alert banner ── */
    .banner {
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .banner.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .banner.info {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
    }

    .card-title {
      margin: 0 0 16px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    /* ── Connection card ── */
    .connect-panel {
      text-align: center;
      padding: 32px 20px;
    }

    .connect-panel p {
      color: var(--text-muted);
      margin: 0 0 20px;
      font-size: 0.95rem;
    }

    .device-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    @media (max-width: 520px) {
      .device-info {
        grid-template-columns: 1fr;
      }
    }

    .info-item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
    }

    .info-item label {
      display: block;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-item span {
      font-size: 0.9rem;
      font-weight: 500;
      word-break: break-all;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      font-family: inherit;
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:not(:disabled):hover {
      transform: translateY(-1px);
    }

    .btn:not(:disabled):active {
      transform: translateY(0);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }

    .btn-primary:not(:disabled):hover {
      background: var(--accent-hover);
    }

    .btn-connect {
      padding: 14px 32px;
      font-size: 1rem;
    }

    .btn-danger {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .btn-danger:not(:disabled):hover {
      background: #fee2e2;
    }

    .btn-warning {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .btn-warning:not(:disabled):hover {
      background: #fef3c7;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-ghost:not(:disabled):hover {
      background: var(--surface-2);
      border-color: #cbd5e1;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-row .btn {
      flex: 0 0 auto;
    }

    /* ── Command input ── */
    .cmd-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .cmd-input-row input {
      flex: 1;
      min-width: 0;
      padding: 12px 16px;
      font-size: 1rem;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .cmd-input-row input::placeholder {
      color: var(--text-muted);
    }

    .cmd-input-row input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .cmd-input-row input:disabled {
      opacity: 0.5;
    }

    .quick-cmds {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 16px;
    }

    .chip {
      padding: 4px 10px;
      font-size: 0.78rem;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
      background: #eff6ff;
    }

    .chip:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Log terminal ── */
    .log-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .log-header .card-title {
      margin: 0;
    }

    .log-dots {
      display: flex;
      gap: 6px;
      margin-right: auto;
      margin-left: 12px;
    }

    .log-dots span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .log-dots span:nth-child(1) { background: #ff5f57; }
    .log-dots span:nth-child(2) { background: #febc2e; }
    .log-dots span:nth-child(3) { background: #28c840; }

    .log-textarea {
      width: 100%;
      height: calc(100vh - 520px);
      min-height: 280px;
      max-height: 480px;
      padding: 16px;
      font-size: 0.82rem;
      font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
      line-height: 1.6;
      background: var(--terminal-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--terminal-text);
      resize: vertical;
    }

    .log-textarea:empty::before,
    .log-empty {
      color: var(--text-muted);
      font-style: italic;
    }

    .log-textarea:focus {
      outline: none;
      border-color: var(--border);
    }

    /* ── Loading overlay ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 36px;
      text-align: center;
      box-shadow: var(--shadow);
      max-width: 320px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .overlay-box p {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .overlay-box .cmd-label {
      margin-top: 8px;
      font-family: monospace;
      color: var(--accent);
      font-size: 1.1rem;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 8px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 0.85rem;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer a:hover {
      color: var(--accent);
    }

    .action-bar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- Loading -->
    <div v-if="loading" class="overlay">
      <div class="overlay-box">
        <div class="spinner"></div>
        <p>等待设备响应</p>
        <div class="cmd-label">{{ currentCMD }}</div>
      </div>
    </div>

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🚗</div>
        <div>
          <h1>YMOBD(v0.0.1)</h1>
          <p>Web Bluetooth 诊断工具</p>
        </div>
      </div>
      <div class="status-pill" :class="statusClass">
        <span class="status-dot"></span>
        <span>{{ statusText }}</span>
      </div>
    </header>

    <!-- Browser unsupported -->
    <div v-if="!bluetoothSupported" class="banner error">
      ⚠️ 当前浏览器不支持 Web Bluetooth，请使用 Chrome / Edge 并通过 HTTPS 或 localhost 访问。
    </div>

    <!-- Status message -->
    <div v-else-if="errMsg && !loading && errMsg !== statusText" class="banner info">
      {{ errMsg }}
    </div>

    <!-- Not connected -->
    <div v-if="!isConnected" class="card connect-panel">
      <p>连接 OBDII 蓝牙适配器，开始发送诊断指令</p>
      <button class="btn btn-primary btn-connect" @click="connectOBD"
        :disabled="!bluetoothSupported || connecting">
        {{ connecting ? '正在连接…' : '🔗 连接蓝牙设备' }}
      </button>
    </div>

    <!-- Connected -->
    <div v-else class="card">
      <div class="device-info">
        <div class="info-item">
          <label>设备名称</label>
          <span>{{ deviceName }}</span>
        </div>
        <div class="info-item">
          <label>当前协议</label>
          <span>{{ ATDP }}</span>
        </div>
      </div>
      <div class="action-bar">
        <button class="btn btn-danger btn-sm" @click="closeBLEConnection">断开连接</button>
      </div>
    </div>

    <!-- Command panel -->
    <div class="card">
      <h2 class="card-title">指令发送</h2>

      <div class="cmd-input-row">
        <input type="text" v-model="inputValue" placeholder="010C / ATDP / 03 …"
          @keyup.enter="startJob" :disabled="!isConnected || isRunning">
        <button class="btn btn-primary" @click="startJob" :disabled="!isConnected || isRunning">
          发送
        </button>
      </div>

      <div class="quick-cmds">
        <button class="chip" v-for="cmd in quickCmds" :key="cmd"
          @click="inputValue = cmd" :disabled="!isConnected || isRunning">{{ cmd }}</button>
      </div>

      <div class="btn-row">
        <button class="btn btn-ghost" @click="startAll" :disabled="!isConnected || isRunning">
          测试所有指令
        </button>
        <button class="btn btn-ghost" @click="startLoop" :disabled="!isConnected || isRunning">
          老化测试
        </button>
        <button class="btn btn-warning" @click="stopRunning" :disabled="!isRunning">
          停止
        </button>
      </div>
    </div>

    <!-- Log panel -->
    <div class="card">
      <div class="log-header">
        <div class="log-dots"><span></span><span></span><span></span></div>
        <h2 class="card-title">通信日志</h2>
        <button class="btn btn-ghost btn-sm" @click="dataHTML = ''">清空</button>
      </div>
      <textarea v-model="dataHTML" readonly class="log-textarea"
        :placeholder="isConnected ? '等待指令发送…' : '连接设备后，日志将显示在此处'"></textarea>
    </div>

    <footer class="footer">
      <a href="https://webbluetoothcg.github.io/web-bluetooth/#bluetooth" target="_blank">Web Bluetooth 提案</a>
      <a href="https://developer.mozilla.org/zh-CN/docs/Web/API/Bluetooth" target="_blank">MDN 文档</a>
    </footer>
  </div>

  <script>
    const SERVICE_UUID = '0000fff0-0000-1000-8000-00805f9b34fb'
    const CMD_TIMEOUT_MS = 10000
    const LOG_MAX_LINES = 500
    const INIT_QUEUE = ['ATZ', 'ATE0', 'ATL0', 'ATH1', 'ATSP0', 'AT+VERSION', 'ATI', '0100', 'ATDP', 'ATRV']
    const LOOP_QUEUE = ['010C', '010D', '010E', '0132', '0146', '0104', '0105', '010B']
    const ALL_TEST_QUEUE = [
      'ATRV', '020200', '020000', '022000', '024000', '020C00', '020D00',
      '03', '07', '0A', '05', '06',
      '0900', '0902', '0904', '0906', '0908', '090A', '090B', '010C', '010D'
    ]

    const eventTarget = new EventTarget()

    new Vue({
      el: '#app',
      data: {
        bluetoothSupported: !!navigator.bluetooth,
        connecting: false,
        loading: false,
        isRunning: false,
        isLoop: false,
        aborted: false,
        gattServer: null,
        bleDevice: null,
        isConnected: false,
        deviceName: '',
        ATDP: '暂无',
        currentCMD: null,
        errMsg: '',
        dataHTML: '',
        characteristicWrite: null,
        writeWithoutResponse: false,
        characteristicNotify: null,
        buffer: '',
        inputValue: '',
        sendTimestamp: '',
        endTimestamp: '',
        pendingCleanup: null,
        quickCmds: ['010C', '010D', '0100', '03', '04', '07', '0902', 'ATDP', 'ATRV', 'ATZ'],
      },
      computed: {
        statusClass() {
          if (this.isConnected && (this.loading || this.isRunning)) return 'busy'
          if (this.isConnected) return 'connected'
          return 'disconnected'
        },
        statusText() {
          if (this.connecting) return '连接中…'
          if (!this.isConnected) return '未连接'
          if (this.loading) return `执行中 · ${this.currentCMD}`
          if (this.isRunning) return this.isLoop ? '老化测试中' : '批量测试中'
          return '已连接'
        },
      },
      created() {
        const saved = localStorage.getItem('____ATDP')
        if (saved) {
          this.ATDP = saved
        }
      },
      beforeDestroy() {
        this.cleanupPending()
        if (this.bleDevice) {
          this.bleDevice.removeEventListener('gattserverdisconnected', this.onDisconnected)
        }
      },
      methods: {
        connectOBD() {
          if (!navigator.bluetooth) {
            alert('当前浏览器不支持 Web Bluetooth')
            return
          }

          this.connecting = true
          this.errMsg = '正在扫描设备…'

          navigator.bluetooth.requestDevice({
            filters: [{services: [SERVICE_UUID]}],
            // filters: [{ name: 'OBDII' }],
            acceptAllDevices: false,
            optionalServices: [SERVICE_UUID],
          }).then(async (device) => {
            this.bleDevice = device
            this.deviceName = device.name || 'OBDII'
            device.addEventListener('gattserverdisconnected', this.onDisconnected)

            const server = await device.gatt.connect()
            this.gattServer = server

            const service = await server.getPrimaryService(SERVICE_UUID)
            const characteristics = await service.getCharacteristics()

            let notifyUUID = null
            let writeUUID = null
            let writeWithoutResponse = false

            for (const item of characteristics) {
              if (item.properties.notify || item.properties.indicate) {
                notifyUUID = item.uuid
              }
              if (item.properties.write) {
                writeUUID = item.uuid
                writeWithoutResponse = false
              } else if (item.properties.writeWithoutResponse && !writeUUID) {
                writeUUID = item.uuid
                writeWithoutResponse = true
              }
            }

            if (!notifyUUID || !writeUUID) {
              throw new Error('未找到可用的 notify / write 特征值')
            }

            this.characteristicNotify = await service.getCharacteristic(notifyUUID)
            this.characteristicWrite = await service.getCharacteristic(writeUUID)
            this.writeWithoutResponse = writeWithoutResponse

            await this.characteristicNotify.startNotifications()
            this.characteristicNotify.addEventListener('characteristicvaluechanged', this.onNotify)

            this.isConnected = true
            this.connecting = false
            this.errMsg = `${this.deviceName} 已连接，正在初始化…`

            await this.runQueue(INIT_QUEUE)
            this.errMsg = ''
          }).catch((error) => {
            this.connecting = false
            if (error.name !== 'NotFoundError') {
              console.error(error)
              alert(error.message || String(error))
            }
            this.errMsg = ''
          })
        },

        onDisconnected() {
          this.cleanupPending()
          this.isConnected = false
          this.isRunning = false
          this.isLoop = false
          this.aborted = false
          this.loading = false
          this.gattServer = null
          this.characteristicWrite = null
          this.characteristicNotify = null
          this.buffer = ''
          this.errMsg = '连接已断开'
        },

        closeBLEConnection() {
          this.stopRunning()
          if (this.gattServer?.connected) {
            this.gattServer.disconnect()
          }
          this.onDisconnected()
        },

        stopRunning() {
          this.aborted = true
          this.isLoop = false
          this.isRunning = false
          this.cleanupPending()
          this.loading = false
          if (this.isConnected) {
            this.errMsg = '已停止'
          }
        },

        cleanupPending() {
          if (this.pendingCleanup) {
            this.pendingCleanup()
            this.pendingCleanup = null
          }
        },

        async runQueue(queue) {
          this.isRunning = true
          this.aborted = false
          try {
            for (let i = 0; i < queue.length; i++) {
              if (this.aborted) break
              await this.writeCmd(queue[i])
              if (this.aborted) break
              if (this.isLoop && i === queue.length - 1) {
                i = -1
              }
            }
          } catch (error) {
            console.error('队列执行失败', error)
            this.appendLog(`\r\n[错误] ${error.message}\r\n`)
            if (this.isConnected) {
              this.errMsg = error.message
            }
          } finally {
            if (!this.isLoop || this.aborted) {
              this.isRunning = false
              if (this.isConnected && !this.aborted) {
                this.errMsg = ''
              }
            }
          }
        },

        writeCmd(cmd) {
          return new Promise((resolve, reject) => {
            if (this.loading) {
              reject(new Error(`上一条指令尚未完成: ${this.currentCMD}`))
              return
            }

            this.loading = true
            this.currentCMD = cmd
            this.buffer = ''
            this.sendTimestamp = this.formatTime()

            const payload = this.encodeCmd(cmd)
            let settled = false

            const finish = (fn, value) => {
              if (settled) return
              settled = true
              clearTimeout(timer)
              eventTarget.removeEventListener('data', onData)
              this.pendingCleanup = null
              this.loading = false
              fn(value)
            }

            const onData = (event) => {
              const raw = event.detail
              this.appendLog(
                `\r\n── ${this.sendTimestamp} ──\r\n` +
                `▶ 发送  ${this.currentCMD}\r\n` +
                `◀ 回复  ${raw.replace(/\r\n/g, '\\r\\n')}\r\n`
              )
              finish(resolve, raw)
            }

            const timer = setTimeout(() => {
              this.buffer = ''
              finish(reject, new Error(`指令 ${cmd} 响应超时 (${CMD_TIMEOUT_MS / 1000}s)`))
            }, CMD_TIMEOUT_MS)

            eventTarget.addEventListener('data', onData)
            this.pendingCleanup = () => finish(reject, new Error('指令已取消'))

            const writePromise = this.writeWithoutResponse
              ? this.characteristicWrite.writeValueWithoutResponse(payload)
              : this.characteristicWrite.writeValue(payload)

            writePromise.catch((error) => {
              finish(reject, error)
            })
          })
        },

        onNotify(event) {
          const chunk = new TextDecoder().decode(event.target.value)
          this.buffer += chunk
          this.endTimestamp = this.formatTime()

          if (!this.buffer.includes('>')) {
            return
          }

          const raw = this.buffer
          this.buffer = ''

          if (this.currentCMD === 'ATDP') {
            const protocol = raw.replace(/[\s\r\n>]/g, '')
            if (protocol) {
              this.ATDP = protocol
              localStorage.setItem('____ATDP', protocol)
            }
          }

          eventTarget.dispatchEvent(new CustomEvent('data', { detail: raw }))
        },

        encodeCmd(cmd) {
          return new TextEncoder().encode(cmd + '\r').buffer
        },

        appendLog(text) {
          this.dataHTML = text + this.dataHTML
          const lines = this.dataHTML.split('\r\n')
          if (lines.length > LOG_MAX_LINES) {
            this.dataHTML = lines.slice(0, LOG_MAX_LINES).join('\r\n')
          }
        },

        async startJob() {
          if (!this.isConnected) {
            alert('请先连接蓝牙')
            return
          }
          const cmd = this.inputValue.trim()
          if (!cmd) {
            alert('请先输入指令')
            return
          }
          this.isLoop = false
          this.isRunning = true
          this.aborted = false
          try {
            await this.writeCmd(cmd)
          } catch (error) {
            console.error(error)
            this.appendLog(`\r\n[错误] ${error.message}\r\n`)
            alert(error.message)
          } finally {
            this.isRunning = false
          }
        },

        startAll() {
          if (!this.isConnected) {
            alert('请先连接蓝牙')
            return
          }
          const queue = ALL_TEST_QUEUE.slice()
          for (let i = 0; i < 96; i++) {
            const hex = i.toString(16).toUpperCase()
            queue.push((hex.length < 2 ? '010' : '01') + hex)
          }
          this.isLoop = false
          this.runQueue(queue)
        },

        startLoop() {
          if (!this.isConnected) {
            alert('请先连接蓝牙')
            return
          }
          this.isLoop = true
          this.runQueue(LOOP_QUEUE.slice())
        },

        formatTime() {
          const date = new Date()
          const pad = (n) => String(n).padStart(2, '0')
          return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ` +
            `${pad(date.getHours())}:${pad(date.getMinutes())}:${pad(date.getSeconds())}:${date.getMilliseconds()}`
        },
      },
    })
  </script>
</body>
