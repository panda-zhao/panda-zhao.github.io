<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BMP 文件解析（MCU565）</title>
  <style>
  :root {
      /* 浅色科技蓝：白底 + 蓝色光晕 */
      --bg: #f5f9ff;
      --card: rgba(255, 255, 255, .92);
      --text: #0f172a;
      --muted: #475569;
      --border: rgba(37, 99, 235, .18);
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #16a34a;
      --radius: 14px;
      --shadow: 0 10px 30px rgba(2, 6, 23, .12);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: var(--sans);
      background:
        radial-gradient(1200px 700px at 15% 5%, rgba(59, 130, 246, .22), transparent 60%),
        radial-gradient(900px 600px at 90% 10%, rgba(14, 165, 233, .18), transparent 60%),
        radial-gradient(900px 700px at 50% 110%, rgba(37, 99, 235, .12), transparent 65%),
        linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      color: var(--text);
      padding: 24px 14px 40px;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h3 {
      margin: 0 0 14px 0;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: .2px;
    }

    /* file input */
    #fileInput {
      width: 100%;
      padding: 10px 12px;
      border: 1px dashed rgba(2, 6, 23, .25);
      background: rgba(255, 255, 255, .65);
      border-radius: 12px;
    }

    #fileInput:hover {
      border-color: rgba(37, 99, 235, .55);
    }

    #fileInput::file-selector-button {
      margin-right: 12px;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: rgba(37, 99, 235, .12);
      color: #0b1b47;
      cursor: pointer;
      font-weight: 600;
    }

    #fileInput::file-selector-button:hover {
      background: rgba(37, 99, 235, .18);
    }

    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(2, 6, 23, .10);
      background: rgba(255, 255, 255, .75);
    }

    .uploader {
      margin-top: 10px;
      display: grid;
      gap: 12px;
    }

    .dropzone {
      border: 1px dashed rgba(2, 6, 23, .25);
      background: rgba(255, 255, 255, .65);
      border-radius: 12px;
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .dropzone.is-dragover {
      border-color: rgba(37, 99, 235, .65);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .10);
    }

    .dropzone .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .file-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .file-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 8px;
    }

    .file-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid rgba(2, 6, 23, .10);
      border-radius: 12px;
      background: rgba(255, 255, 255, .85);
    }

    .file-item .thumb {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(2, 6, 23, .08);
      background: #f3f4f6;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-item .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .file-item .meta {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .file-item .name {
      font-weight: 700;
      color: #0b1b47;
      font-size: 13.5px;
      word-break: break-word;
    }

    .file-item .sub {
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .btn-danger {
      border-color: rgba(220, 38, 38, .35);
      background: rgba(220, 38, 38, .08);
      color: #7f1d1d;
    }

    .btn-danger:hover {
      border-color: rgba(220, 38, 38, .55);
      background: rgba(220, 38, 38, .12);
    }

    #result:empty {
      display: none;
    }

    #result p {
      margin: 8px 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    #result p:first-child {
      margin-top: 0;
      color: #0b1b47;
      font-weight: 700;
    }

    #result .mono {
      font-family: var(--mono);
      font-size: 12.5px;
      color: #0b1b47;
    }

    #result .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      appearance: none;
      border: 1px solid rgba(2, 6, 23, .12);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 10px 12px;
      cursor: pointer;
      font-weight: 650;
      letter-spacing: .2px;
      transition: transform .08s ease, background-color .15s ease, border-color .15s ease;
    }

    button:hover {
      border-color: rgba(37, 99, 235, .35);
      background: rgba(37, 99, 235, .06);
    }

    button:active {
      transform: translateY(1px);
    }

    .btn-primary {
      border-color: rgba(37, 99, 235, .45);
      background: var(--primary);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      border-color: rgba(37, 99, 235, .65);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .75);
    }

    @media (max-width: 480px) {
      body {
        padding: 14px 10px 26px;
      }

      .container {
        padding: 14px;
      }

      h3 {
        font-size: 16px;
      }

      button {
        width: 100%;
        justify-content: center;
      }
    }

    /* 保持浅色统一，不跟随系统暗色模式变暗（按你的需求） */
    @media (prefers-color-scheme: dark) {
      body {
        background:
          radial-gradient(1200px 700px at 15% 5%, rgba(59, 130, 246, .22), transparent 60%),
          radial-gradient(900px 600px at 90% 10%, rgba(14, 165, 233, .18), transparent 60%),
          radial-gradient(900px 700px at 50% 110%, rgba(37, 99, 235, .12), transparent 65%),
          linear-gradient(180deg, #ffffff 0%, var(--bg) 100%);
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>上传 BMP 文件解析 (by Zhaowy v2.1 修复版)</h3>
    <div class="uploader">
      <div class="dropzone" id="dropzone">
        <div class="file-actions">
          <input type="file" id="fileInput" accept=".bmp" multiple>
          <button class="btn-ghost" id="clearFilesBtn" type="button">清空列表</button>
          <button class="btn-primary" id="convertBtn" type="button">开始转换</button>
        </div>
        <div class="hint">
          你可以多次选择文件来追加；也可以把 BMP 直接拖到这里。转换前可在下方列表中删除单个文件。默认 = 读取到的像素格式；实际使用的像素格式为读取到的格式或在列表中设置的覆盖格式。
          <br><b>提示：最大支持 4096x4096 像素 | 20MB 文件大小</b>
        </div>
        <ul class="file-list" id="fileList"></ul>
      </div>
    </div>
    <div id="result"></div>
  </div>

  <script>
    // 最大像素限制 + 最大文件大小限制（20MB）
    const MAX_PIXEL_COUNT = 4096 * 4096;
    const MAX_FILE_SIZE = 20 * 1024 * 1024; // 20MB 字节数
    // 文件队列（支持追加/删除）
    const pendingFiles = new Map(); // key -> File
    const previewUrls = new Map(); // key -> objectURL
    // 用户在文件列表中预先选择的 16 位格式覆盖（key -> '565'|'555')
    const fileOverrides = new Map();
    // 保存转换结果（多文件）- 规范为const，仅修改属性
    const convertResult = { images: [], colorTable: [] };

    const fileInputEl = document.getElementById('fileInput');
    const fileListEl = document.getElementById('fileList');
    const resultEl = document.getElementById('result');
    const dropzoneEl = document.getElementById('dropzone');
    const convertBtnEl = document.getElementById('convertBtn');
    const clearFilesBtnEl = document.getElementById('clearFilesBtn');

    fileInputEl.addEventListener('change', (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      addFilesToQueue(files);
      // 允许再次选择同一批文件（否则 change 不触发）
      fileInputEl.value = '';
    });

    clearFilesBtnEl.addEventListener('click', () => {
      pendingFiles.clear();
      convertResult.images = [];
      convertResult.colorTable = [];
      renderFileList();
      resultEl.innerHTML = '';
    });

    convertBtnEl.addEventListener('click', async () => {
      const files = Array.from(pendingFiles.values());
      if (!files.length) {
        alert('请先添加 BMP 文件到列表。');
        return;
      }
      try {
        // 逐个解析并转换（只处理 bmp）
        const bmpFiles = files.filter(f => (f?.name || '').toLowerCase().endsWith('.bmp'));
        if (!bmpFiles.length) throw new Error('列表中没有 BMP 文件。');

        const images = [];
        for (const file of bmpFiles) {
          const key = getFileKey(file);
          const { width, height, data, bmpType, compression, masks, pixelOffset, headerSize, formatJudge } = await parseBmpFile(file);
          const override16 = fileOverrides.get(key) || undefined;
          images.push({
            file,
            fileBaseName: file.name.replace(/\.bmp$/i, ''),
            symbolName: sanitizeCIdentifier(file.name.replace(/\.bmp$/i, '')),
            rawData: data,
            width,
            height,
            bmpType,
            compression,
            masks,
            pixelOffset,
            headerSize,
            formatJudge, // 新增：16位BMP规范判定结果
            override16
          });
        }

        // 交给统一渲染函数处理（包括根据 override 计算 rgb565、生成颜色表等）
        renderConvertResult(images);

      } catch (err) {
        alert('转换失败：' + err.message);
        console.error('错误详情：', err);
        convertResult.images = [];
        convertResult.colorTable = [];
      }
    });

    // 拖拽上传
    ;['dragenter', 'dragover'].forEach(evt => {
      dropzoneEl.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzoneEl.classList.add('is-dragover');
      });
    });
    ;['dragleave', 'drop'].forEach(evt => {
      dropzoneEl.addEventListener(evt, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzoneEl.classList.remove('is-dragover');
      });
    });
    dropzoneEl.addEventListener('drop', (e) => {
      const files = Array.from(e.dataTransfer?.files || []);
      if (!files.length) return;
      addFilesToQueue(files);
    });

    function getFileKey(file) {
      // 用于“去重/删除”的稳定 key（同名不同内容也能区分）
      return `${file.name}__${file.size}__${file.lastModified}`;
    }

    function addFilesToQueue(files) {
      let added = 0;
      for (const f of files) {
        if (!f) continue;
        // 校验文件格式
        if (!(String(f.name || '').toLowerCase().endsWith('.bmp'))) continue;
        // 校验文件大小
        if (f.size > MAX_FILE_SIZE) {
          alert(`文件【${f.name}】过大（${formatBytes(f.size)}），最大支持${formatBytes(MAX_FILE_SIZE)}`);
          continue;
        }
        const key = getFileKey(f);
        if (!pendingFiles.has(key)) {
          pendingFiles.set(key, f);
          added++;
          // 生成预览 URL（BMP 也可以用 objectURL 直接展示）
          const url = URL.createObjectURL(f);
          previewUrls.set(key, url);
        }
      }
      if (!added) {
        alert('未添加新文件（仅支持 BMP，且会自动忽略重复项/超大文件）。');
      }
      renderFileList();
      // 改变文件队列后，旧的转换结果就不再可靠
      convertResult.images = [];
      convertResult.colorTable = [];
      resultEl.innerHTML = '';
    }

    function renderFileList() {
      const files = Array.from(pendingFiles.values());
      if (!files.length) {
        fileListEl.innerHTML = '';
        return;
      }
      fileListEl.innerHTML = files.map(f => {
        const key = getFileKey(f);
        const url = previewUrls.get(key);
        // 若在 fileOverrides 中有值则使用该覆盖，否则使用自动检测（auto）
        const selVal = fileOverrides.has(key) ? fileOverrides.get(key) : 'auto';
        return `
          <li class="file-item" data-key="${escapeHtml(key)}">
            <div class="thumb">
              ${url ? `<img src="${escapeHtml(url)}" alt="preview">` : '<span class="sub">预览</span>'}
            </div>
            <div class="meta">
              <div class="name">${escapeHtml(f.name)}</div>
              <div class="sub">${formatBytes(f.size)} · ${new Date(f.lastModified).toLocaleString()}</div>
            </div>
            <div style="display:flex;gap:8px;align-items:center">
              <label style="font-size:12px;color:#475569">格式</label>
              <select data-override-select="${escapeHtml(key)}" style="border-radius:8px;padding:6px;font-size:12px">
                <option value="auto" ${selVal==='auto'?'selected':''}>自动检测</option>
                <option value="565" ${selVal==='565'?'selected':''}>RGB565</option>
                <option value="555" ${selVal==='555'?'selected':''}>RGB555</option>
              </select>
              <button class="btn-ghost" type="button" data-hex="${escapeHtml(key)}">十六进制</button>
              <button class="btn-danger" type="button" data-remove="${escapeHtml(key)}">删除</button>
            </div>
          </li>
        `;
      }).join('');

      // 事件委托：删除单项
      fileListEl.querySelectorAll('button[data-remove]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-remove');
          if (!key) return;
          pendingFiles.delete(key);
          const url = previewUrls.get(key);
          if (url) URL.revokeObjectURL(url);
          previewUrls.delete(key);
          convertResult.images = [];
          convertResult.colorTable = [];
          renderFileList();
          resultEl.innerHTML = '';
        });
      });
      // 绑定查看十六进制按钮
      fileListEl.querySelectorAll('button[data-hex]').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.getAttribute('data-hex');
          if (!key) return;
          const file = pendingFiles.get(key);
          if (!file) return alert('找不到对应文件');
          showHexForFile(file);
        });
      });
      // 绑定文件列表中的 override 下拉（保存到 fileOverrides）
      fileListEl.querySelectorAll('select[data-override-select]').forEach(sel => {
        sel.addEventListener('change', () => {
          const key = sel.getAttribute('data-override-select');
          if (!key) return;
          const val = sel.value; // 'auto' | '565' | '555'
          if (val === 'auto') {
            // 删除覆盖使其回到自动检测行为
            fileOverrides.delete(key);
          } else if (val === '565' || val === '555') {
            fileOverrides.set(key, val);
          }
        });
      });
    }

    function formatBytes(bytes) {
      const b = Number(bytes) || 0;
      if (b < 1024) return `${b} B`;
      const kb = b / 1024;
      if (kb < 1024) return `${kb.toFixed(1)} KB`;
      const mb = kb / 1024;
      if (mb < 1024) return `${mb.toFixed(1)} MB`;
      const gb = mb / 1024;
      return `${gb.toFixed(2)} GB`;
    }

    // 清理残留的 objectURL（刷新页面后浏览器会自动回收，这里是运行期删除的补充）
    window.addEventListener('beforeunload', () => {
      previewUrls.forEach(url => URL.revokeObjectURL(url));
      previewUrls.clear();
    });

    /**
     * 解析 BMP 文件（支持16/24/32位无压缩，并支持 BITFIELDS 掩码）
     */
    function parseBmpFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);

        reader.onload = (e) => {
          try {
            const buffer = e.target.result;
            const view = new DataView(buffer);

            // 验证 BMP 魔数
            if (view.getUint16(0, true) !== 0x4D42) {
              reject(new Error('不是标准的 BMP 文件（魔数验证失败）'));
              return;
            }

            // 读取 BMP 头信息
            const pixelOffset = view.getUint32(10, true);
            const headerSize = view.getUint32(14, true);
            // 支持常见的 DIB 头版本：40/52/56/108/124
            if (![40, 52, 56, 108, 124].includes(headerSize)) {
              reject(new Error(`不支持的 BMP 头格式（头大小：${headerSize} 字节）`));
              return;
            }

            const width = view.getUint32(18, true);
            // 高度字段可能为有符号（负值表示 top-down）
            const height = view.getInt32(22, true);
            const bitsPerPixel = view.getUint16(28, true);
            const compression = view.getUint32(30, true);

            // 校验基础参数
            const absHeight = Math.abs(height);
            const pixelCount = width * absHeight;
            if (width <= 0 || absHeight <= 0) reject(new Error(`BMP 尺寸异常：宽=${width} 高=${height}`));
            if (pixelCount > MAX_PIXEL_COUNT) reject(new Error(`图像尺寸过大，最大支持 4096x4096`));
            // 允许无压缩(0)或 BITFIELDS(3)。其他压缩类型不支持。
            if (compression !== 0 && compression !== 3) reject(new Error(`不支持的 BMP 压缩类型：${compression}`));

            // 校验支持的位深
            if (![16, 24, 32].includes(bitsPerPixel)) {
              reject(new Error(`暂不支持 ${bitsPerPixel} 位的 BMP，仅支持 16/24/32 位无压缩 BMP`));
              return;
            }

            // 计算行字节数（4字节对齐）
            const rowSize = Math.floor((bitsPerPixel * width + 31) / 32) * 4;
            let pixelData = null;

            // 若为 BITFIELDS（compression === 3），尝试读取颜色掩码
            // 掩码通常位于 DIB 头之后或 BITMAPINFOHEADER 的后面（偏移 14+40）。
            let masks = null;
            if (compression === 3) {
              const candidates = [14 + headerSize, 14 + 40];
              for (const maskOffset of candidates) {
                if (maskOffset + 12 <= buffer.byteLength && maskOffset + 12 <= pixelOffset) {
                  const rMask = view.getUint32(maskOffset, true);
                  const gMask = view.getUint32(maskOffset + 4, true);
                  const bMask = view.getUint32(maskOffset + 8, true);
                  // 简单验证：掩码不应全为0或全相同无意义值
                  if ((rMask | gMask | bMask) !== 0 && !(rMask === gMask && gMask === bMask)) {
                    masks = [rMask >>> 0, gMask >>> 0, bMask >>> 0];
                    break;
                  }
                }
              }
              // 如果未找到合适掩码，则当作无掩码处理（仍继续解析像素）
            }

            // 按位深解析像素数据
            const startY = height < 0 ? 0 : absHeight - 1;
            const endY = height < 0 ? absHeight - 1 : 0;
            const stepY = height < 0 ? 1 : -1;

            if (compression === 3) {
              // 使用掩码时按像素原始字节读取为 Uint32Array 便于按掩码解码
              const pixelBytes = bitsPerPixel / 8;
              pixelData = new Uint32Array(pixelCount);
              let pixelIndex = 0;
              for (let y = startY; y !== endY + stepY; y += stepY) {
                for (let x = 0; x < width; x++) {
                  const offset = pixelOffset + y * rowSize + x * pixelBytes;
                  if (offset + pixelBytes - 1 >= buffer.byteLength) {
                    reject(new Error('BMP 文件损坏：像素数据超出文件范围'));
                    return;
                  }
                  let val = 0;
                  for (let b = 0; b < pixelBytes; b++) {
                    val |= view.getUint8(offset + b) << (8 * b);
                  }
                  pixelData[pixelIndex++] = val >>> 0;
                }
              }
            } else {
              if (bitsPerPixel === 16) {
                // 解析 16 位 BMP 像素（每个像素2字节）
                pixelData = new Uint16Array(pixelCount);
                let pixelIndex = 0;
                for (let y = startY; y !== endY + stepY; y += stepY) {
                  for (let x = 0; x < width; x++) {
                    const offset = pixelOffset + y * rowSize + x * 2;
                    if (offset + 1 >= buffer.byteLength) {
                      reject(new Error('BMP 文件损坏：像素数据超出文件范围'));
                      return;
                    }
                    // 读取 16 位像素值（小端序）
                    pixelData[pixelIndex++] = view.getUint16(offset, true);
                  }
                }
              } else if (bitsPerPixel === 24 || bitsPerPixel === 32) {
                // 解析 24/32 位 BMP 为 RGB888 数组
                pixelData = new Uint8ClampedArray(pixelCount * 3);
                let pixelIndex = 0;
                const pixelBytes = bitsPerPixel / 8; // 3或4字节/像素
                for (let y = startY; y !== endY + stepY; y += stepY) {
                  for (let x = 0; x < width; x++) {
                    const offset = pixelOffset + y * rowSize + x * pixelBytes;
                    if (offset + 2 >= buffer.byteLength) {
                      reject(new Error('BMP 文件损坏：像素数据超出文件范围'));
                      return;
                    }
                    // BMP 存储顺序是 BGR，转换为 RGB
                    const b = view.getUint8(offset);
                    const g = view.getUint8(offset + 1);
                    const r = view.getUint8(offset + 2);
                    pixelData[pixelIndex++] = r;
                    pixelData[pixelIndex++] = g;
                    pixelData[pixelIndex++] = b;
                  }
                }
              }
            }

            // 调用16位BMP规范判定函数，生成判定结果
            let formatJudge = null;
            if (bitsPerPixel === 16) {
              formatJudge = judge16bBmpFormat(view);
            }

            resolve({
              width,
              height: absHeight,
              data: pixelData,
              bmpType: bitsPerPixel,
              compression,
              masks,
              pixelOffset,
              headerSize,
              formatJudge // 新增：16位BMP格式判定结果
            });
          } catch (innerErr) {
            reject(new Error(`解析 BMP 时出错：${innerErr.message}`));
          }
        };

        reader.onerror = () => reject(new Error('文件读取失败：' + reader.error.message));
      });
    }

/**
 * 自动判定16位BMP的像素格式（RGB555/RGB565）
 * @param {DataView} view - BMP文件的DataView对象（解析BMP时已创建，直接复用）
 * @returns {Object} 判定结果：格式标识、是否需要转换、关键参数
 * @throws {Error} 非16位BMP时抛出错误
 */
function judge16bBmpFormat(view) {
    // 1. 读取核心判定字段（均遵循小端序）
    const bitCount = view.getUint16(28, true); // 像素位深（偏移28-29，所有BMP头通用）
    const compression = view.getUint32(30, true); // 压缩方式（偏移30-33，所有BMP头通用）
    const pixelOffset = view.getUint32(10, true); // 像素数据起始偏移（偏移10-13，文件头通用）
    const headerSize = view.getUint32(14, true); // 信息头长度（偏移14-17）

    // 前置验证：仅处理16位BMP
    if (bitCount !== 16) {
        throw new Error(`非16位BMP，位深为${bitCount}bit，无需判定RGB555/RGB565`);
    }
    // 修复：兼容所有标准BMP头长度（与parseBmpFile保持一致）
    if (![40, 52, 56, 108, 124].includes(headerSize)) {
        throw new Error(`不支持的非标准BMP头，头长度${headerSize}字节`);
    }

    // 2. 核心判定：根据压缩方式+像素偏移组合判断（BMP规范硬性规则，与头版本无关）
    let format = '';
    let needConvertTo565 = false; // 是否需要转RGB565（RGB555→true，RGB565→false）
    let desc = '';

    if (compression === 0) { // 压缩方式=BI_RGB（无掩码）
        format = 'RGB555';
        needConvertTo565 = true;
        desc = '16位BI_RGB，官方默认RGB555（R5G5B5+1位空位），无颜色掩码';
        // 标准像素偏移：文件头(14) + 信息头(headerSize)，无掩码段
        const standardOffset = 14 + headerSize;
        if (pixelOffset !== standardOffset) {
            console.warn(`[警告] RGB555 BMP像素偏移非标准${standardOffset}字节，实际为${pixelOffset}字节，建议检查文件完整性`);
        }
    } else if (compression === 3) { // 压缩方式=BI_BITFIELDS（有掩码）
        format = 'RGB565';
        needConvertTo565 = false;
        desc = '16位BI_BITFIELDS，掩码定义RGB565（R5G6B5），16位全有效无空位';
        // 标准像素偏移：文件头(14) + 信息头(headerSize) + 颜色掩码(12)，至少比无掩码多12字节
        const minStandardOffset = 14 + headerSize + 12;
        if (pixelOffset < minStandardOffset) {
            console.warn(`[警告] RGB565 BMP像素偏移过小，实际为${pixelOffset}字节，标准至少${minStandardOffset}字节，可能缺失颜色掩码`);
        }
    } else {
        throw new Error(`不支持的16位BMP压缩方式：${compression}，仅支持BI_RGB(0)/BI_BITFIELDS(3)`);
    }

    // 3. 返回判定结果（含后续转换所需的关键标识）
    return {
        bmpFormat: format, // 最终格式：RGB555/RGB565
        needConvertTo565,  // 工具核心标识：是否需要转RGB565
        compression,       // 压缩方式（0=BI_RGB，3=BI_BITFIELDS）
        pixelOffset,       // 像素数据起始偏移（复用至后续像素读取）
        bitCount,          // 位深（16）
        description: desc  // 格式描述（便于日志/提示）
    };
}

    // Wrapper: 用解析得到的 meta 对象快速判定（无需 DataView）
    function judge16bBmpFormatFromMeta(meta) {
      const { bitCount, compression, pixelOffset, headerSize } = meta;
      if (bitCount !== 16) throw new Error('非16位BMP');
      if (headerSize !== 40) throw new Error('不支持非标准BMP头');
      let bmpFormat = 'RGB565';
      let needConvertTo565 = false;
      let desc = '';
      if (compression === 0) {
        bmpFormat = 'RGB555'; needConvertTo565 = true; desc = 'BI_RGB 无掩码，依据规范为 RGB555';
      } else if (compression === 3) {
        bmpFormat = 'RGB565'; needConvertTo565 = false; desc = 'BI_BITFIELDS 有掩码，通常为 RGB565';
      } else {
        throw new Error('不支持的 16 位压缩方式');
      }
      return { bmpFormat, needConvertTo565, compression, pixelOffset, bitCount, description: desc };
    }

    /**
     * 自动检测 16 位 BMP 是 RGB555 还是 RGB565（仅在没有 BITFIELDS 掩码时使用）
     */
    function detect16BitRgbFormat(pixelData) {
      const len = pixelData.length;
      if (len === 0) return '565';
      const sample = Math.min(len, 2000);
      const step = Math.max(1, Math.floor(len / sample));
      const gSet565 = new Set();
      const gSetFrom555 = new Set();
      for (let i = 0; i < len; i += step) {
        const p = pixelData[i] & 0xFFFF;
        const g565 = (p >> 5) & 0x3F;
        gSet565.add(g565);
        const g5 = (p >> 5) & 0x1F;
        const gFrom555 = (g5 << 1) | (g5 >> 4);
        gSetFrom555.add(gFrom555);
      }
      const u565 = gSet565.size;
      const u555 = gSetFrom555.size;
      // 若第15位（MSB）极少出现，优先判为 RGB555（常见于 15-bit 图像，bit15 未使用）
      let msbCount = 0;
      for (let i = 0; i < len; i += step) {
        if ((pixelData[i] & 0x8000) !== 0) msbCount++;
      }
      const samples = Math.ceil(len / step);
      if (msbCount / samples < 0.01) return '555';
      // 优先选择能产生更多绿通道级别（更少条带感）的解释
      if (u565 >= u555 + 6) return '565';
      if (u555 >= u565 + 6) return '555';
      return '565';
    }

    /**
     * 统一转换为标准 RGB565
     */
    function convertToRgb565(data, bmpType, masks) {
      // 如果传入 masks（BITFIELDS），data 是 Uint32Array 的原始像素值
      const rgb565Array = new Uint16Array(data.length);

      function maskInfo(mask) {
        let shift = 0;
        while (shift < 32 && ((mask >>> shift) & 1) === 0) shift++;
        let bits = 0;
        let tmp = mask >>> shift;
        while (bits < 32 && (tmp & 1) === 1) { bits++; tmp >>>= 1; }
        if (bits === 0) bits = 1;
        return { shift, bits };
      }

      if (masks && (bmpType === 16 || bmpType === 32)) {
        const [rMask, gMask, bMask] = masks;
        const rInfo = maskInfo(rMask);
        const gInfo = maskInfo(gMask);
        const bInfo = maskInfo(bMask);
        const rMax = (1 << rInfo.bits) - 1;
        const gMax = (1 << gInfo.bits) - 1;
        const bMax = (1 << bInfo.bits) - 1;

        for (let i = 0; i < data.length; i++) {
          const p = data[i] >>> 0;
          const rRaw = (p & rMask) >>> rInfo.shift;
          const gRaw = (p & gMask) >>> gInfo.shift;
          const bRaw = (p & bMask) >>> bInfo.shift;
          const r5 = Math.round(rRaw * 31 / rMax) & 0x1F;
          const g6 = Math.round(gRaw * 63 / gMax) & 0x3F;
          const b5 = Math.round(bRaw * 31 / bMax) & 0x1F;
          rgb565Array[i] = (r5 << 11) | (g6 << 5) | b5;
        }
        return rgb565Array;
      }

      if (bmpType === 16) {
        // 默认将所有 16 位像素按 RGB565 解释（5R/6G/5B）
        for (let i = 0; i < data.length; i++) {
          const p = data[i] & 0xFFFF;
          const r5 = (p >> 11) & 0x1F;
          const g6 = (p >> 5) & 0x3F;
          const b5 = (p >> 0) & 0x1F;
          rgb565Array[i] = (r5 << 11) | (g6 << 5) | b5;
        }
      } else if (bmpType === 24 || bmpType === 32) {
        // 24/32位 BMP (RGB888) → RGB565
        const pixelCount = data.length / 3 | 0;
        for (let i = 0; i < pixelCount; i++) {
          const r = data[i * 3];
          const g = data[i * 3 + 1];
          const b = data[i * 3 + 2];
          const r5 = (r >> 3) & 0x1F;
          const g6 = (g >> 2) & 0x3F;
          const b5 = (b >> 3) & 0x1F;
          rgb565Array[i] = (r5 << 11) | (g6 << 5) | b5;
        }
      }

      return rgb565Array;
    }

    // 根据 images 数据渲染转换结果，并绑定覆盖选择事件
    function renderConvertResult(images) {
      // 确保每张图有 override16 字段（默认 RGB565，除非掩码明确为 RGB555）
      images.forEach(img => {
        if (img.override16 === undefined) {
          if (img.bmpType === 16 && img.compression === 3 && img.masks) {
            const [rMask, gMask, bMask] = img.masks;
            if (rMask === 0x7C00 && gMask === 0x03E0 && bMask === 0x001F) img.override16 = '555';
            else img.override16 = '565';
          } else if (img.bmpType === 16 && !img.masks) {
            // 优先使用规范判定结果，兜底用启发式检测
            if (img.formatJudge) {
              img.override16 = img.formatJudge.bmpFormat === 'RGB555' ? '555' : '565';
              console.log(`规范判定【${img.file.name}】→ ${img.override16 === '555' ? 'RGB555' : 'RGB565'}`);
            } else {
              img.override16 = detect16BitRgbFormat(img.rawData);
              console.warn(`兜底检测【${img.file.name}】→ ${img.override16 === '555' ? 'RGB555' : 'RGB565'}`);
            }
          } else {
            img.override16 = '565';
          }
        }
        // 重新计算当前图的 rgb565Array（若需要）
        if (img.bmpType === 16) {
          // 未使用掩码时按 override16 解释
          if (!img.masks) {
            const pixelCount = img.rawData.length;
            const arr = new Uint16Array(pixelCount);
            for (let i = 0; i < pixelCount; i++) {
              const p = img.rawData[i] & 0xFFFF;
              if (img.override16 === '565') {
                const r5 = (p >> 11) & 0x1F;
                const g6 = (p >> 5) & 0x3F;
                const b5 = (p >> 0) & 0x1F;
                arr[i] = (r5 << 11) | (g6 << 5) | b5;
              } else {
                // 修复：RGB555转RGB565绿通道线性缩放，保证色彩还原
                const r5 = (p >> 10) & 0x1F;
                const g5 = (p >> 5) & 0x1F;
                const b5 = (p >> 0) & 0x1F;
                const g6 = Math.round(g5 * 63 / 31) & 0x3F; // 线性缩放5位→6位
                arr[i] = (r5 << 11) | (g6 << 5) | b5;
              }
            }
            img.rgb565Array = arr;
          } else {
            img.rgb565Array = convertToRgb565(img.rawData, img.bmpType, img.masks);
          }
        } else {
          img.rgb565Array = convertToRgb565(img.rawData, img.bmpType, img.masks);
        }
      });

      // 生成“全局”颜色表并索引
      const { colorTable, colorMap } = generateGlobalColorTable(images);
      if (colorTable.length > 256) {
        alert(`异常：合并后的颜色表数量=${colorTable.length}，超过255（索引必须为0~255）`);
        return;
      }
      // 生成带时间戳的颜色表符号名并保存到 convertResult，方便下载时使用
      const colorTableTs = Date.now();
      const colorTableName = `Color_Tab_${colorTableTs}`;
      for (const img of images) {
        img.indexArray = generateIndexArrayFromGlobalMap(img.rgb565Array, colorMap);
        img.pixelIndexPacked = packPixelIndexWithWH(img.width, img.height, img.indexArray, colorTableName);
      }
      convertResult.colorTableName = colorTableName;

      // 更新转换结果
      convertResult.images = images;
      convertResult.colorTable = colorTable;

      // 生成显示 HTML
      const totalPixels = images.reduce((sum, it) => sum + (it.width * it.height), 0);
      const fileListHtml = images.map(it => {
        let defaultFormat = '';
        let usedFormat = '';
        
        if (it.bmpType === 16) {
          if (it.compression === 3 && it.masks) {
            const [rMask, gMask, bMask] = it.masks;
            let maskName = '';
            if (rMask === 0xF800 && gMask === 0x07E0 && bMask === 0x001F) maskName = 'RGB565';
            else if (rMask === 0x7C00 && gMask === 0x03E0 && bMask === 0x001F) maskName = 'RGB555';
            else maskName = `掩码 0x${rMask.toString(16)},0x${gMask.toString(16)},0x${bMask.toString(16)}`;
            defaultFormat = maskName;
            usedFormat = it.override16 ? (it.override16 === '565' ? 'RGB565' : 'RGB555') : maskName;
          } else {
            defaultFormat = it.formatJudge ? '规范判定' : '自动检测';
            usedFormat = it.override16 ? (it.override16 === '565' ? 'RGB565' : 'RGB555') : defaultFormat;
          }
        } else if (it.bmpType === 24) {
          defaultFormat = 'RGB888';
          usedFormat = 'RGB888';
        } else if (it.bmpType === 32) {
          defaultFormat = 'RGB888/含Alpha或BITFIELDS';
          usedFormat = 'RGB888/含Alpha或BITFIELDS';
        } else {
          defaultFormat = `${it.bmpType} 位`;
          usedFormat = defaultFormat;
        }

        const fmt = `${it.bmpType} 位`;
        return `<p class="mono">- ${escapeHtml(it.file.name)}：${it.width} x ${it.height}，${fmt}，已转换为 ${usedFormat}（默认：${defaultFormat}）</p>`;
      }).join('');

      resultEl.innerHTML = `
                    <p>✅ 转换完成：</p>
                    <p>文件数量：${images.length}</p>
                    <p>总像素数：${totalPixels}</p>
                    <p>唯一颜色数（合并后 color_table）：${colorTable.length} 种</p>
                    ${fileListHtml}
                    <p>颜色表（前10个，16进制）：<br>
                       <span class="mono">${colorTable.slice(0, 10).map(v => '0x' + v.toString(16).padStart(4, '0')).join(', ')}...</span>
                    </p>
                    ${images.length === 1 ? (() => {
                      const img = images[0];
                      const firstTen = Array.from(img.rgb565Array).slice(0, 10);
                      function rgb565ToHex(v) {
                        const r5 = (v >> 11) & 0x1F;
                        const g6 = (v >> 5) & 0x3F;
                        const b5 = v & 0x1F;
                        const r = Math.round(r5 * 255 / 31);
                        const g = Math.round(g6 * 255 / 63);
                        const b = Math.round(b5 * 255 / 31);
                        return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
                      }
                      const items = firstTen.map((v, idx) => `<span style="display:inline-flex;align-items:center;margin-right:8px"><span style="width:14px;height:14px;border:1px solid #ddd;display:inline-block;background:${rgb565ToHex(v)};margin-right:6px"></span><span class=\"mono\">${'0x'+v.toString(16).padStart(4,'0')}</span></span>`).join('');
                      // raw bytes (前 64 字节) 便于核对
                      let rawHex = '';
                      try {
                        const ta = img.rawData;
                        const byteOffset = ta.byteOffset || 0;
                        const byteLen = Math.min(64, ta.byteLength || (ta.length * (ta.BYTES_PER_ELEMENT || 1)));
                        const raw = new Uint8Array(ta.buffer, byteOffset, byteLen);
                        rawHex = Array.from(raw).map(b => b.toString(16).padStart(2, '0')).join(' ');
                      } catch (e) {
                        rawHex = '读取 rawData 失败';
                      }
                      return `<p class="mono">原始像素前 64 字节（hex）：<br>${rawHex}</p><p class="mono">前 10 个像素颜色：<br>${items}</p>`;
                    })() : ''}
              <div class="actions" aria-label="下载选项">
                <button class="btn-primary" id="downloadHBtn">下载 Ym_ui.h</button>
                <button class="btn-ghost" id="downloadCBtn">下载 Ym_ui.c</button>
              </div>
              <div style="margin-top:12px">
                <p class="mono">预览渲染：</p>
                <div id="renderControls" class="actions"></div>
                <div id="renderCanvasContainer" style="margin-top:10px;"></div>
              </div>
                `;

      // 绑定下载按钮（统一命名为Ym_ui.h/Ym_ui.c，跨平台兼容）
      document.getElementById('downloadHBtn').addEventListener('click', () => {
        downloadTextFile(
          `Ym_ui.h`,
          buildHeaderFileContent(convertResult.images, convertResult.colorTable.length, convertResult.colorTableName)
        );
      });
      document.getElementById('downloadCBtn').addEventListener('click', () => {
        downloadTextFile(`Ym_ui.c`, buildSourceFileContent(convertResult.images, convertResult.colorTable, convertResult.colorTableName));
      });

      // 绑定渲染按钮
      const renderControls = document.getElementById('renderControls');
      const renderContainer = document.getElementById('renderCanvasContainer');
      renderControls.innerHTML = '';
      convertResult.images.forEach((img, idx) => {
        const btn = document.createElement('button');
        btn.textContent = `预览: ${img.fileBaseName}`;
        btn.className = 'btn-ghost';
        btn.addEventListener('click', () => {
          renderContainer.innerHTML = '';
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          renderContainer.appendChild(canvas);
          renderImageFromData(canvas, img.pixelIndexPacked, convertResult.colorTable);
        });
        renderControls.appendChild(btn);
      });
    }

    /**
     * 生成“多文件合并”的全局颜色表
     */
    function generateGlobalColorTable(images) {
      const colorMap = new Map(); // color(uint16) -> index(uint8)
      const colorTable = [];

      for (const img of images) {
        const arr = img.rgb565Array;
        for (let i = 0; i < arr.length; i++) {
          const color = arr[i];
          if (!colorMap.has(color)) {
            colorMap.set(color, colorTable.length);
            colorTable.push(color);
          }
        }
      }
      return { colorTable: Uint16Array.from(colorTable), colorMap };
    }

    /**
     * 使用“全局颜色表”生成索引数组
     */
    function generateIndexArrayFromGlobalMap(rgb565Array, colorMap) {
      const indexArray = new Uint8Array(rgb565Array.length);
      for (let i = 0; i < rgb565Array.length; i++) {
        const idx = colorMap.get(rgb565Array[i]);
        // 理论上一定能找到；这里防御一下
        if (idx === undefined) throw new Error('内部异常：颜色表映射缺失');
        if (idx > 255) throw new Error(`异常：颜色索引值=${idx}，超过255`);
        indexArray[i] = idx;
      }
      return indexArray;
    }

    /**
     * 像素索引表最前面加 4 个字节：
     * - 前两个字节：宽度（uint16，小端）
     * - 后两个字节：高度（uint16，小端）
     * 紧接着第5字节开始放置颜色表名字（null 结尾），然后是像素索引数据
     */
    function packPixelIndexWithWH(width, height, indexArray, colorTableName) {
      if (width < 0 || width > 0xFFFF) throw new Error(`宽度超出uint16范围：${width}`);
      if (height < 0 || height > 0xFFFF) throw new Error(`高度超出uint16范围：${height}`);
      const encoder = new TextEncoder();
      const nameBytes = encoder.encode(String(colorTableName || ''));
      const packed = new Uint8Array(4 + nameBytes.length + 1 + indexArray.length);
      packed[0] = width & 0xFF;
      packed[1] = (width >> 8) & 0xFF;
      packed[2] = height & 0xFF;
      packed[3] = (height >> 8) & 0xFF;
      // 放置名字并以 0 结尾
      packed.set(nameBytes, 4);
      packed[4 + nameBytes.length] = 0;
      // 放置像素索引
      packed.set(indexArray, 4 + nameBytes.length + 1);
      return packed;
    }

    function formatUint16HexArray(arr, perLine = 10, indent = '    ') {
      return Array.from(arr)
        .map(v => `0x${v.toString(16).padStart(4, '0')}`)
        .reduce((acc, val, idx) => {
          acc += val;
          if (idx !== arr.length - 1) acc += ', ';
          if (idx % perLine === perLine - 1 && idx !== arr.length - 1) acc += `\n${indent}`;
          return acc;
        }, '');
    }

    function formatUint8HexArray(arr, perLine = 16, indent = '    ') {
      return Array.from(arr)
        .map(v => `0x${v.toString(16).padStart(2, '0')}`)
        .reduce((acc, val, idx) => {
          acc += val;
          if (idx !== arr.length - 1) acc += ', ';
          if (idx % perLine === perLine - 1 && idx !== arr.length - 1) acc += `\n${indent}`;
          return acc;
        }, '');
    }

    // 显示十六进制查看器（首次调用时创建 modal）
    function createHexModal() {
      if (document.getElementById('hexModal')) return;
      const modal = document.createElement('div');

      const box = document.createElement('div');

      box.style.maxHeight = '80%';
      box.style.overflow = 'auto';
      box.style.background = '#fff';
      box.style.borderRadius = '12px';
      box.style.padding = '14px';
      box.style.boxShadow = '0 10px 30px rgba(2,6,23,0.2)';

      const title = document.createElement('div');

      title.style.alignItems = 'center';
      title.style.marginBottom = '8px';

      const h = document.createElement('div');
      h.textContent = '十六进制查看器（前512字节）';
      h.style.fontWeight = '700';

      const controls = document.createElement('div');
      controls.style.display = 'flex';
      controls.style.gap = '8px';

      const copyBtn = document.createElement('button');
      copyBtn.textContent = '复制';

      copyBtn.addEventListener('click', () => {

        navigator.clipboard.writeText(pre.textContent).then(() => alert('已复制到剪贴板')); 
      });

      const closeBtn = document.createElement('button');
      closeBtn.textContent = '关闭';
      closeBtn.className = 'btn-danger';
      closeBtn.addEventListener('click', () => modal.remove());

      controls.appendChild(copyBtn);
      controls.appendChild(closeBtn);

      title.appendChild(h);
      title.appendChild(controls);

      const pre = document.createElement('pre');
      pre.style.whiteSpace = 'pre-wrap';
      pre.style.fontFamily = 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas';
      pre.style.fontSize = '12px';
      pre.style.lineHeight = '1.4';
      pre.style.margin = '0';

      box.appendChild(title);
      box.appendChild(pre);
      modal.appendChild(box);
      document.body.appendChild(modal);

      // 新增：点击遮罩层关闭
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.remove();
      });

      // 新增：ESC按键关闭
      const handleEsc = (e) => {
        if (e.key === 'Escape') {
          modal.remove();
          document.removeEventListener('keydown', handleEsc);
        }
      };
      document.addEventListener('keydown', handleEsc);
    }

    function showHexForFile(file, maxBytes = 512) {
      createHexModal();
      const modal = document.getElementById('hexModal');
      const pre = modal.querySelector('pre');
      pre.textContent = '读取中...';
      const slice = file.slice(0, maxBytes);
      const fr = new FileReader();
      fr.onload = (e) => {
        const buf = e.target.result;
        const bytes = new Uint8Array(buf);
        // 格式化为 hexdump -C 风格
        let lines = [];
        for (let i = 0; i < bytes.length; i += 16) {
          const chunk = bytes.slice(i, i + 16);
          const hex = Array.from(chunk).map(b => b.toString(16).padStart(2, '0')).join(' ');
          const ascii = Array.from(chunk).map(b => (b >= 0x20 && b <= 0x7e) ? String.fromCharCode(b) : '.').join('');
          lines.push(i.toString(16).padStart(8, '0') + '  ' + hex.padEnd(47, ' ') + '  |' + ascii + '|');
        }
        pre.textContent = lines.join('\n');
      };
      fr.onerror = () => { pre.textContent = '读取失败：' + fr.error?.message; };
      fr.readAsArrayBuffer(slice);
    }

    function buildHeaderFileContent(images, colorTableLen, colorTableName) {
      // extern 声明使用非数组形式，严格对应 const YM_UI_STRUCT 的定义
      const externIndexDecls = images.map(img => {
        return `extern const YM_UI_STRUCT ${img.symbolName}_pixel_index;`;
      }).join('\n');

      return `#ifndef __YM_UI_H
#define __YM_UI_H

#include <stdint.h>

#define COLOR_TABLE_LEN   (${colorTableLen}U)

/* YM_UI 图片像素索引结构 */
typedef struct
{
    uint16_t width;  
    uint16_t height; 
   uint16_t *Color_Tab; // 颜色表指针
    uint8_t ColorIndex[];  
} YM_UI_STRUCT;

/* 颜色表（带时间戳） */
extern const uint16_t ${colorTableName}[];

${externIndexDecls}

#endif
`;
    }

    function buildSourceFileContent(images, colorTable, colorTableName) {
      const colorTableStr = formatUint16HexArray(colorTable, 10, '    ');

      const imageBlocks = images.map(img => {
        // 使用 img.indexArray（已是每像素 uint8 索引）生成 ColorIndex 的字面量
        const count = img.indexArray ? img.indexArray.length : 0;
        const idxStr = formatUint8HexArray(img.indexArray || [], 16, '    ');
        // 使用指定初始化器直接生成 const YM_UI_STRUCT 实例（单个变量）
        return `/* ${img.fileBaseName}.bmp → YM_UI 结构（宽=${img.width} 高=${img.height}，索引数=${count}） */
const YM_UI_STRUCT ${img.symbolName}_pixel_index = {
    .width = ${img.width},
    .height = ${img.height},
    .Color_Tab = (uint16_t*)${colorTableName},
    .ColorIndex = { ${idxStr} }
};
`;
      }).join('\n\n');

      return `/*
 * BMP 多文件合并转换为 RGB565 的颜色表和像素索引表
 * 生成时间：${new Date().toLocaleString()}
 * 工具版本：BMP转RGB565 v2.0 修复版
 * 颜色表符号：${colorTableName}
 */

#include "Ym_ui.h"

/* RGB565 颜色表（存储所有唯一颜色值） */
const uint16_t ${colorTableName}[] = {
    ${colorTableStr}
};

${imageBlocks}`;
    }

    function downloadTextFile(fileName, content) {
      try {
        const blob = new Blob([content], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert('文件下载失败：' + err.message);
        console.error(err);
      }
    }

    /**
     * 从生成的 color_table (Uint16Array) 与像素索引打包数组渲染到 canvas
     * @param {HTMLCanvasElement} canvas
     * @param {Uint8Array} pixelIndexPacked - 前4字节为宽高（小端），后面为每像素索引
     * @param {Uint16Array} colorTable - RGB565 值数组
     */
    function renderImageFromData(canvas, pixelIndexPacked, colorTable) {
      try {
        if (!(pixelIndexPacked && pixelIndexPacked.length >= 4)) throw new Error('像素索引数据格式错误');
        const w = pixelIndexPacked[0] | (pixelIndexPacked[1] << 8);
        const h = pixelIndexPacked[2] | (pixelIndexPacked[3] << 8);
        // 解析可选的颜色表名字（以 NUL 终止），名字从第5个字节开始
        let indices;
        let name = '';
        if (pixelIndexPacked.length > 4) {
          // 查找 NUL 结束符（限制最大名字长度为64防止误判）
          const maxNameLen = 64;
          const endLimit = Math.min(pixelIndexPacked.length, 4 + maxNameLen + 1);
          let zeroPos = -1;
          for (let i = 4; i < endLimit; i++) {
            if (pixelIndexPacked[i] === 0) { zeroPos = i; break; }
          }
          if (zeroPos !== -1) {
            // 校验是否是可打印 ASCII（避免把索引误当名字）
            let printable = true;
            for (let i = 4; i < zeroPos; i++) {
              const b = pixelIndexPacked[i];
              if (b < 32 || b > 126) { printable = false; break; }
            }
            if (printable) {
              name = new TextDecoder().decode(pixelIndexPacked.slice(4, zeroPos));
              indices = pixelIndexPacked.slice(zeroPos + 1);
            } else {
              indices = pixelIndexPacked.slice(4);
            }
          } else {
            indices = pixelIndexPacked.slice(4);
          }
        } else {
          indices = new Uint8Array(0);
        }
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w; canvas.height = h;
        }
        const ctx = canvas.getContext('2d');
        const imgData = ctx.createImageData(w, h);
        // 预解码 color table 到 RGBA 查表
        const colorRGBA = new Uint8ClampedArray(colorTable.length * 4);
        for (let i = 0; i < colorTable.length; i++) {
          const c = colorTable[i] & 0xFFFF;
          const r5 = (c >> 11) & 0x1F;
          const g6 = (c >> 5) & 0x3F;
          const b5 = c & 0x1F;
          const r = (r5 * 255 / 31) | 0;
          const g = (g6 * 255 / 63) | 0;
          const b = (b5 * 255 / 31) | 0;
          const off = i * 4;
          colorRGBA[off] = r;
          colorRGBA[off + 1] = g;
          colorRGBA[off + 2] = b;
          colorRGBA[off + 3] = 255;
        }

        for (let i = 0; i < indices.length && i < w * h; i++) {
          const idx = indices[i];
          const offDst = i * 4;
          const offSrc = idx * 4;
          imgData.data[offDst] = colorRGBA[offSrc] || 0;
          imgData.data[offDst + 1] = colorRGBA[offSrc + 1] || 0;
          imgData.data[offDst + 2] = colorRGBA[offSrc + 2] || 0;
          imgData.data[offDst + 3] = 255;
        }
        ctx.putImageData(imgData, 0, 0);
      } catch (err) {
        console.error('渲染失败：', err);
        alert('渲染失败：' + err.message);
      }
    }

    function sanitizeCIdentifier(name) {
      // C 标识符：字母/数字/下划线，且不能以数字开头
      let s = String(name || '').trim();
      s = s.replace(/[^a-zA-Z0-9_]/g, '_');
      if (!s) s = 'bmp';
      if (/^[0-9]/.test(s)) s = '_' + s;
      return s;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
